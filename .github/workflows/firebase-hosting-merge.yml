name: Deploy to Firebase Hosting on Merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_AUTHORIZED_EMAILS: ${{ secrets.VITE_AUTHORIZED_EMAILS }}
          VITE_GCP_API_KEY: ${{ secrets.VITE_GCP_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_FLAMINGO_497112 }}
          channelId: live
          projectId: project-flamingo-497112

      # Hosting alone is not the whole app: security rules and the callable
      # functions have to ship with the code that depends on them, or a merge
      # leaves the frontend asking for permissions the live ruleset denies.
      - name: Authenticate the Firebase CLI
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_FLAMINGO_497112 }}
        run: printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy Firestore and Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,storage --project project-flamingo-497112 --non-interactive

      # The CLI loads functions/index.js to discover what to deploy, so the
      # functions' own dependencies must exist locally — the root `npm ci`
      # above does not install them.
      - name: Install functions dependencies
        run: npm ci --prefix functions

      # Kept as its own step: a functions deploy is the slow, most
      # failure-prone part, and rules should already be live if it trips.
      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx --yes firebase-tools@latest deploy --only functions --project project-flamingo-497112 --non-interactive
